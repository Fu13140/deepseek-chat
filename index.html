<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>DeepSeek 助手</title>
<style>
  :root{
    --bg:#1a1a2e; --panel:#16213e; --card:#0f3460; --accent:#4d5dfb;
    --text:#eaeaff; --muted:#9aa0c3; --user:#4d5dfb; --ai:#21325e;
    --border:#2c3566; --danger:#ff6b6b; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Roboto,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
    background:rgba(26,26,46,.8); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .hgroup{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;}
  header h1 .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;}
  .icon-btn{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .icon-btn:active{transform:scale(.95);}
  main{flex:1;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
  .welcome{text-align:center;color:var(--muted);margin-top:35vh;font-size:14px;line-height:1.8;}
  .welcome strong{color:var(--text);font-size:17px;display:block;margin-bottom:6px;}
  .msg{display:flex;gap:10px;margin-bottom:18px;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .msg .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .msg.user{flex-direction:row-reverse;}
  .msg.user .avatar{background:var(--user);}
  .msg.ai .avatar{background:var(--card);border:1px solid var(--border);font-size:20px;line-height:1;}
  .bubble{
    max-width:78%;padding:11px 14px;border-radius:var(--radius);font-size:15px;line-height:1.65;word-break:break-word;white-space:pre-wrap;
  }
  .msg.user .bubble{background:var(--user);border-top-right-radius:4px;}
  .msg.ai .bubble{background:var(--ai);border:1px solid var(--border);border-top-left-radius:4px;}
  .cursor{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:middle;animation:blink 1s steps(1) infinite;border-radius:2px;margin-left:2px;}
  @keyframes blink{50%{opacity:0;}}
  footer{
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(26,26,46,.85);
    border-top:1px solid var(--border);flex-shrink:0;
  }
  .input-row{display:flex;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:8px 8px 8px 16px;}
  textarea{
    flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font-size:15px;line-height:1.5;resize:none;max-height:120px;font-family:inherit;padding-top:6px;
  }
  .send{
    width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;
  }
  .send:disabled{opacity:.4;cursor:not-allowed;}
  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.open{display:flex;}
  .sheet{width:100%;max-width:560px;background:var(--panel);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:slideUp .28s ease;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}
  .grip{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;flex-shrink:0;}
  .sheet h2{font-size:17px;margin-bottom:16px;flex-shrink:0;}
  .scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .field input,.field select{
    width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:12px 14px;font-size:15px;outline:none;font-family:inherit;
  }
  .field input:focus,.field select:focus{border-color:var(--accent);}
  .field .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .btn{
    width:100%;background:var(--accent);border:none;color:#fff;font-size:15px;font-weight:600;
    padding:13px;border-radius:12px;cursor:pointer;margin-top:6px;flex-shrink:0;
  }
  .btn:active{transform:scale(.98);}
  .sess-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0;}
  .sess-head h2{margin:0;}
  .sess-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;}
  .sess-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;}
  .sess-item.active{border-color:var(--accent);background:rgba(77,93,251,.15);}
  .sess-item .del{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px;}
  .sess-empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="hgroup">
    <button class="icon-btn" id="sessionsBtn">📂</button>
    <h1><span class="dot"></span>DeepSeek 助手</h1>
  </div>
  <button class="icon-btn" id="settingsBtn">⚙️ 设置</button>
</header>

<main id="chatBox">
  <div class="welcome">
    <strong>👋 你好，我是 DeepSeek</strong>
    输入内容开始对话<br>
    点左上角「📂」管理会话记录<br>
    点右上角「⚙️」填入 API Key · 设置 AI 人设<br>
    <span id="modelTip" style="font-size:12px;color:#6b7196;"></span>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
    <button class="send" id="sendBtn">➤</button>
  </div>
</footer>

<!-- 会话列表弹窗 -->
<div class="overlay" id="sessOverlay">
  <div class="sheet">
    <div class="grip"></div>
    <div class="sess-head">
      <h2>📂 会话记录</h2>
      <button class="icon-btn" id="newBtn">＋ 新建对话</button>
    </div>
    <div class="scroll-area" id="sessionList"></div>
    <button class="btn" id="sessCloseBtn" style="background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:400;">关闭</button>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="grip"></div>
    <h2>⚙️ 设置</h2>
    <div class="scroll-area">
      <div class="field">
        <label>DeepSeek API Key</label>
        <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
        <div class="hint">key 仅保存在你本机浏览器（localStorage），不会上传到任何服务器。可到 <b>platform.deepseek.com</b> 申请。</div>
      </div>
      <div class="field">
        <label>模型</label>
        <select id="modelSelect">
          <option value="deepseek-v4-flash">deepseek-v4-flash（快速 · 便宜）</option>
          <option value="deepseek-chat">deepseek-chat（通用 · 兼容）</option>
          <option value="deepseek-v4-pro">deepseek-v4-pro（强推理）</option>
          <option value="deepseek-reasoner">deepseek-reasoner（深度思考）</option>
        </select>
      </div>
      <button class="btn" id="ycBtn" style="background:var(--card);border:1px solid var(--accent);color:var(--text);font-weight:500;">🎭 一键填入「现代校园语C」预设</button>
      <div class="field">
        <label>AI 人设（系统调教词）</label>
        <textarea id="personaInput" rows="5" placeholder="粘贴你的角色扮演/系统提示词…" style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-size:14px;outline:none;font-family:inherit;resize:vertical;"></textarea>
        <div class="hint">作为 system 消息全程生效，用于设定 AI 的人设、语气与规则。</div>
      </div>
    </div>
    <button class="btn" id="saveBtn">保存</button>
    <div style="height:8px"></div>
    <button class="btn" id="clearBtn" style="background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:400;">清空当前对话</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://api.deepseek.com/chat/completions';
const $ = id => document.getElementById(id);

let apiKey = localStorage.getItem('ds_key') || '';
let model  = localStorage.getItem('ds_model') || 'deepseek-v4-flash';
let persona = localStorage.getItem('ds_persona') || '你是一个友好、专业、乐于助人的中文助手。';

/* ---------- 会话管理 ---------- */
const SESS_KEY='ds_sessions', CUR_KEY='ds_cur';
let sessions = [];        // [{id,title,messages:[{role,content}]}]
let curId = null;
let history = [];         // 当前会话消息（不含 system）
try{ sessions = JSON.parse(localStorage.getItem(SESS_KEY)||'[]') || []; }catch(e){ sessions=[]; }
curId = localStorage.getItem(CUR_KEY);

function persist(){
  localStorage.setItem(SESS_KEY, JSON.stringify(sessions));
  localStorage.setItem(CUR_KEY, curId);
}
function ensureSession(){
  if(!sessions.find(s=>s.id===curId)){
    const id = 's' + Date.now();
    sessions.unshift({ id, title:'新对话', messages:[] });
    curId = id; persist();
  }
}
function currentSession(){ return sessions.find(s=>s.id===curId); }
function saveCurrent(){
  const cur = currentSession(); if(!cur) return;
  cur.messages = history.slice();
  if(!cur.title || cur.title==='新对话'){
    const f = history.find(m=>m.role==='user');
    if(f) cur.title = f.content.slice(0, 22);
  }
  persist();
}
function renderAll(){
  chatBox.innerHTML = '';
  const cur = currentSession() || { messages:[] };
  history = cur.messages.filter(m=>m.role!=='system').map(m=>({role:m.role, content:m.content}));
  if(history.length===0){ restoreEmpty(); return; }
  history.forEach(m=>{
    if(m.role==='user') addMsg('user').textContent = m.content;
    else if(m.role==='assistant') addMsg('ai').textContent = m.content;
  });
  chatBox.scrollTop = chatBox.scrollHeight;
}
function renderSessionList(){
  const list = $('sessionList'); list.innerHTML='';
  if(sessions.length===0){
    list.innerHTML = '<div class="sess-empty">还没有会话，点右上角「＋ 新建」开始</div>';
    return;
  }
  sessions.forEach(s=>{
    const item = document.createElement('div');
    item.className = 'sess-item' + (s.id===curId ? ' active' : '');
    const t = document.createElement('span'); t.className='t'; t.textContent = s.title;
    const del = document.createElement('button'); del.className='del'; del.textContent='🗑';
    del.onclick = e=>{
      e.stopPropagation();
      if(!confirm('删除这个会话？')) return;
      sessions = sessions.filter(x=>x.id!==s.id);
      if(curId===s.id){ curId=null; persist(); ensureSession(); }
      else persist();
      renderSessionList(); renderAll();
    };
    item.onclick = ()=>{ if(s.id!==curId){ curId=s.id; persist(); } $('sessOverlay').classList.remove('open'); renderAll(); };
    item.appendChild(t); item.appendChild(del);
    list.appendChild(item);
  });
}
function newSession(){
  sessions = sessions.filter(s=>s.messages.length>0 || s.title!=='新对话');
  const id = 's'+Date.now();
  sessions.unshift({ id, title:'新对话', messages:[] });
  curId = id; persist();
  renderAll();
}

/* ---------- 设置 ---------- */
const campusPreset = `【角色扮演设定】
你正在进行一场中文现代都市/校园题材的文字扮演（语C），请严格遵循以下规则：

一、角色人设
  扮演：角色名【  】。
  设定：【年龄、性格、外貌特征、家庭或校园背景、说话语气、与我的关系——如同桌/学长/青梅竹马/前任等】。
  你始终以该角色身份说话，绝不跳出角色、绝不自称AI。

二、叙事与文笔
  1. 以"你"称呼我，回应我的动作与话语。
  2. 描写含动作、神态、语气与细腻心理，多用细节渲染氛围（光线、声音、衣角、呼吸），避免说明文体。
  3. 每次回复150~300字，情绪关键点可适当延展，克制而有张力。

三、语C格式
  - 动作/神态/心理/环境描写 → 用括号或**加粗**，例如：（他别过脸，耳尖却悄悄泛红）
  - 台词 → 正常书写引号，例如："下课了，还不走？"
  - 可根据我偏好切换：书面语C / 剧本式 / 小说叙事式。

四、节奏与推进
  - 顺着我的选择推进，保持人设与剧情一致，别忘记前文细节。
  - 学生时代或都市日常，注重日常感与情感渐变，不跳跃、不急转折。

五、边界
  保持适度尊重与边界感，涉及不适宜内容时以角色方式自然带过。`;

const chatBox = $('chatBox'), input = $('input'), sendBtn = $('sendBtn');
$('apiKeyInput').value = apiKey;
$('modelSelect').value = model;
$('personaInput').value = persona;
$('modelTip').textContent = '当前模型：' + model;

/* ---------- 弹窗开关 ---------- */
$('settingsBtn').onclick = () => { $('overlay').classList.add('open'); };
$('overlay').onclick = e => { if(e.target === $('overlay')) $('overlay').classList.remove('open'); };
$('sessionsBtn').onclick = () => { renderSessionList(); $('sessOverlay').classList.add('open'); };
$('newBtn').onclick = () => { newSession(); $('sessOverlay').classList.remove('open'); toast('已新建对话'); };
$('sessCloseBtn').onclick = () => { $('sessOverlay').classList.remove('open'); };
$('sessOverlay').onclick = e => { if(e.target === $('sessOverlay')) $('sessOverlay').classList.remove('open'); };

$('saveBtn').onclick = () => {
  apiKey = $('apiKeyInput').value.trim();
  model  = $('modelSelect').value;
  persona = $('personaInput').value.trim() || '你是一个友好、专业、乐于助人的中文助手。';
  localStorage.setItem('ds_key', apiKey);
  localStorage.setItem('ds_model', model);
  localStorage.setItem('ds_persona', persona);
  $('modelTip').textContent = '当前模型：' + model;
  $('overlay').classList.remove('open');
  toast(apiKey ? '✅ 设置已保存（含 AI 人设）' : '⚠️ API Key 为空，将无法对话');
};
$('ycBtn').onclick = () => {
  $('personaInput').value = campusPreset;
  toast('🎭 已填入校园语C预设，点「保存」生效');
};
$('clearBtn').onclick = () => {
  if(!confirm('清空当前会话的聊天记录？')) return;
  const cur = currentSession(); if(cur){ cur.messages=[]; cur.title='新对话'; persist(); }
  renderAll();
  toast('当前对话已清空');
};

/* ---------- 消息渲染 ---------- */
function addMsg(role){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '🙂' : '';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
  return bubble;
}
function restoreEmpty(){
  chatBox.innerHTML = '<div class="welcome"><strong>👋 你好，我是 DeepSeek</strong>输入内容开始对话<br>点左上角「📂」管理会话记录<br><span id="modelTip" style="font-size:12px;color:#6b7196;">当前模型：'+model+'</span></div>';
  $('modelTip').textContent = '当前模型：' + model;
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- 发送 ---------- */
input.addEventListener('input', ()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });
input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
sendBtn.onclick = send;

async function send(){
  const text = input.value.trim();
  if(!text || sendBtn.disabled) return;
  if(!apiKey){ toast('⚠️ 请先在设置中填入 API Key'); return; }

  ensureSession();
  input.value=''; input.style.height='auto';
  sendBtn.disabled = true;

  history.push({role:'user', content:text});
  addMsg('user').textContent = text;

  const aiBubble = addMsg('ai');
  aiBubble.innerHTML = '<span class="cursor"></span>';

  let fullText = '';
  try{
    const resp = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+apiKey },
      body: JSON.stringify({
        model,
        messages:[{ role:'system', content: persona }, ...history],
        stream:true,
        max_tokens:4096
      })
    });

    if(!resp.ok){
      let err = '请求失败 ('+resp.status+')';
      try{ const j = await resp.json(); err = (j.error && j.error.message) || err; }catch(e){}
      throw new Error(err);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        const l = line.trim();
        if(!l.startsWith('data:')) continue;
        const data = l.slice(5).trim();
        if(data === '[DONE]') continue;
        try{
          const json = JSON.parse(data);
          const delta = json.choices && json.choices[0] && json.choices[0].delta;
          if(delta && delta.content){
            fullText += delta.content;
            aiBubble.textContent = fullText;
            chatBox.scrollTop = chatBox.scrollHeight;
          }
        }catch(e){}
      }
    }
    if(!fullText) fullText = '（无回复内容）';
    aiBubble.textContent = fullText;
    history.push({role:'assistant', content:fullText});
  }catch(err){
    aiBubble.textContent = '❌ ' + (err.message || '请求出错');
    history.pop();
  }finally{
    saveCurrent();
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ---------- 启动 ---------- */
ensureSession();
renderAll();
</script>
</body>
</html>
